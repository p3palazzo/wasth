id: str(matches=regex(r'^([2-9CFGHJMPQRVWX]{8})\+([2-9CFGHJMPQRVWX]{3})$', name='OLC Plus Code 11')) # LIDO:recordID
excerpt: str()
date: day(min='2022-01-01') # LIDO:recordMetadataDate
author: include('orcid')
title: str(min=3, max=75)
# required=False enums will be given a default value at runtime
title_type: enum("brandName", "cited", "creator", "descriptive", "former", "inscribed", "owner", "popular", "repository", "translated", "other", required=False) # descriptive
title_source: list(include('citation'), required=False)
bibliographic_citation: list(include('citation'), required=False) # remove? LIDO:relation instead
work_type:
  condition: list(include('typed_refs'), required=False)
  form: list(include('typed_refs'), required=False)
  function: list(include('typed_refs'), required=False)
  context: list(include('typed_refs'), required=False)
  material_tech: list(include('typed_refs'), required=False)
  subject_type: list(include('typed_refs'), required=False)
  use: list(include('typed_refs'), required=False)
classifications: list(include('classification'), required=False)
tags: list(str(), required=False) # Simple, provisional replacement for lido:classification
spatial:
  site: include('place')
  former: list(include('place'), required=False)
  intended: list(include('place'), required=False)
  other: list(include('place'), required=False)
repository: list(include('repository'), required=False)
location_historic: list(include('historic_place'), required=False)
identifiers: list(include('typed_refs'), required=False) # lido:publishedID
titles: list(include('alternate_title'), required=False)
inscriptions: list(include('inscription'), required=False)
format: include('format_map', required=False)
events: list(include('event'), required=False)
subject: list(include('topic'), required=False)
relation: list(include('object'), required=False)
work_rights: list(include('right'), required=False)
record_rights: list(include('right'))
collection: list(include('typed_refs'), required=False) # Provisional
resources: list(include('resource'), required=False)
header: include('header_map', required=False)
# LIDO:description is the content of the Markdown document.
---
url: regex(r'^https?:\/\/(?:([\w\-]+\.)+[\w\-]+)(?:\/[^\s]*)?$', name='URL')

orcid: regex('([0-9X]{4})-([0-9X]{4})-([0-9X]{4})-([0-9X]{4})', name='ORCiD')

coordinates: regex('^[0-9,\.\[\] ]+$', name='coordinates')

lido_term: regex('^http://terminology.lido-schema.org/lido([0-9]{5})$', name="LIDO Terminology")

typed_refs:
  type: enum('local', 'iri', 'uri', required=False) # URI or autodetect
  term: include('lido_term', required=False)
  refid: str(required=False) # QUASE sempre obrigatório, arqtrad/thesaurus
  display: str(required=False)
  source: list(any(include('citation'), include('legal_body')), required=False)

citation:
  refid: regex(r'@[a-zA-Z0-9_][\w:.#$%&\-+?<>~\/]*', name='CSL citekey')
  note: str(max=75, required=False) # número de página, etc.
  display: str(required=False)

note:
  headline: str(required=False)
  text: str(required=False)
  source: include('citation', required=False)
  rights: include('right', required=False)

place:
  #type: enum('site', 'formerSite', 'intended', 'other', required=False)
  # no formato novo os tipos de lugares estão mapeados em `spatial`
  display: str(required=False)
  name: include('typed_refs', required=False) # arqtrad/lugar, antigo `place`
  location: include('gml_point')
  extent: include('gml_poly', required=False)
  srs_name: include('typed_refs', required=False) # antigo: srsName
  source: any(include('legal_body'), include('citation'))
  zoom: int(min=0, max=18, required=False) # 13

repository:
  type: enum('corporate', 'geographic', 'personal', 'other', required=False) # corporate, ou lido_term?
  display: str(required=False)
  name: include('legal_body', required=False)
  id: include('typed_refs', required=False)
  part_of: include('repository', required=False)

historic_place:
  type: enum("corporate", "geographic", "personal", "other") # geographic
  name: include('typed_refs', required=False) # antigo concept

gml_point:
  lat: num(min=-90, max=90)
  lon: num(min=-180, max=180)
  alt: num(min=0, max=10000, required=False)

gml_poly:
  type: enum("Polygon", "MultiPolygon", "LineString")
  coordinates: include('coordinates')

alternate_title:
  type: enum("brandName", "cited", "creator", "descriptive", "former", "inscribed", "owner", "popular", "repository", "translated", "other")
  display: str(min=3)
  pref: include('lido_term', required=False) # http://terminology.lido-schema.org/pref
  source: include('citation', required=False)

inscription:
  type: enum('signature', 'mark', 'caption', 'date', 'text', 'translation', 'other')
  transcription: list(include('transcription'), required=False)
  description: list(include('note'), required=False)

transcription:
  lang: regex('^[a-zA-Z- ]+$', min=2)
  text: str()

format_map:
  extent: include('extent_map', required=False)
  medium: include('medium_map', required=False)

extent_map:
  display: str(required=False)
  measurements: list(include('size'), required=False)

medium_map:
  display: str(required=False)
  material: list(include('material_tech'), required=False)
  technique: list(include('material_tech'), required=False)

size:
  type: include('lido_term') # http://terminology.lido-schema.org/objectMeasurementsSet_type
  extent: include('extent', required=False)
  value: num(min=0)
  unit: include('typed_refs') # Provisional
  qualifier: str(required=False) # Provisional
  format: str(required=False) # Provisional
  shape: str(required=False) # Provisional
  scale: num(min=0, required=False)
  source: include('citation', required=False)

material_tech:
  type: enum('medium', 'support', 'other', required=False)
  concept: include('typed_refs')
  extent: include('typed_refs', required=False)
  source: include('citation')

event:
  text: include('note') # TimelineJS3
  href: include('url', required=False)
  type: enum('alteration', 'broadcast', 'bulk', 'commission', 'creation', 'design', 'destruction', 'discovery', 'exhibition', 'inclusive', 'performance', 'publication', 'restoration', 'view', 'other') # ou lido_term?
  actor_role: list(include('actor'), required=False)
  start_date: include('event_date', required=False)
  end_date: include('event_date', required=False)
  periods: list(include('typed_refs'), required=False)
  cultures: list(include('typed_refs'), required=False)
  places: list(include('place'), required=False)
  place_type: include('lido_term', required=False)
  methods: list(include('typed_refs'), required=False)
  materials_tech: list(include('material_tech'), required=False)
  measurements: list(include('size'), required=False)
  related: list(include('typed_refs'), required=False)
  things_present: list(include('typed_refs'), required=False)
  media: list(include('media'), required=False)

event_date: # revisar timeline.njk, LIDO e Signore (1997). 
  #year: int()
  #month: int(min=1, max=12, required=False)
  #day: int(min=1, max=31, required=False)
  earliest_date: day(required=False)
  latest_date: day(required=False)
  display_date: str(required=False)
  type: enum("estimated", "exact")

topic:
  display: str(required=False)
  type: enum('descriptiveTopic', 'conceptTopic', 'iconographicTopic', 'otherTopic')
  extent: include('extent', required=False)
  concept: include('typed_refs')

object:
  display: str(required=False) # descrição textual da relação
  name: include('typed_refs', required=False)
  resource: include('media', required=False)
  object_type: include('lido_term', required=False) # http://terminology.lido-schema.org/objectType
  object_note: list(include('note'), required=False) # LIDO-Handbuch: Describes how the related object is related or relevant to this object.
  type: include('lido_term') # http://terminology.lido-schema.org/relatedWorkRelType
  source: list(include('citation'), required=False)

resource:
  id: include('typed_refs', required=False) # QUASE sempre obrigatório, arqtrad/desenho
  type: include('typed_refs')
  rel_type: enum('planFor', 'modelFor', 'imageOf', 'preparatoryFor', 'prototypeFor', 'studyFor', required=False) # planFor
  preview_image: include('media', required=False)
  provided_image: list(include('media'), required=False)
  provided_3d: list(include('media'), required=False)
  service: list(include('typed_refs'), required=False)
  description: str(required=False)
  perspective: int(min=0, max=9) # ISO 19650-2 view codes
  unit: include('typed_refs', required=False) # mm
  source: list(include('legal_body'), required=False)
  citation: list(include('citation'), required=False)
  credit: include('orcid')
  date: include('temporal')
  rights: list(include('right'))

right:
  concept: include('typed_refs', required=False)
  type: enum('generic', 'specific', required=False) # http://terminology.lido-schema.org/rightsType_type
  temporal: event_date(required=False)
  holder: include('legal_body', required=False)

legal_body:
  type: enum('personal', 'corporate', 'family', 'other', required=False) # corporate
  name: include('typed_refs', required=False) # antigo concept

actor:
  name: include('typed_refs', required=False) # antigo concept
  type: enum('personal', 'corporate', 'family', 'other', required=False) # personal
  role: include('typed_refs')
  qualifier: list(include('typed_refs'), required=False)
  extent: list(include('typed_refs'), required=False)
  source: include('citation')

extent: include('typed_refs') # Provisional

media:
  type: include('lido_term', required=False) # http://terminology.lido-schema.org/resourceRepresentation_type
  teaser: include('url', required=False)
  href: include('url')
  format: include('typed_refs')
  measurements: list(include('size'), required=False)
  caption: str(required=False)
  alt: str(required=False)
  credit: str(required=False)
  rights: list(include('right'), required=False)

header_map:
  teaser: include('url', required=False)
  overlay_image: include('url', required=False)
  caption: str(required=False)
